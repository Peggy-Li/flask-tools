[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-tools"
version = "0.1.0"
description = "FLASK-tool: Chemistry-tool for FLASK project"
authors = []
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "lc_conductor>=0.1.0",
    "charge>=0.1.0",
    "fastmcp>=3.0.0, <4.0.0",
    "jsonschema>=4.17.3",
    "loguru>=0.7.0",
    "pydantic>=2.10.7",
    "click",
    "rdkit>=2025.3.6",
    "pre-commit",
    "black",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flask_tools*"]

[tool.setuptools.package-data]
"flask_tools.pipette" = ["assets/*", "data/*"]

# This creates the console script
[project.scripts]
flask-tools-install = "flask_tools.install:main"
pipette = "flask_tools.pipette.grade_rxn:main"
pipette-rdt = "flask_tools.pipette.rdt.verifiers:main"

[project.optional-dependencies]
rdkit = ["rdkit>=2025.3.6"]
flask = ["transformers", "peft", "datasets==4.5.0", "trl", "torch>=2.8.0"]
chemprop = ["chemprop>=2.2.0", "torch>=2.8.0", "lightning"]
chemprice = []
similarity_search = ["faiss-cpu", "torch>=2.8.0"]
molecular_minds = ["torch-geometric"]
test = ["pytest", "pytest-asyncio", "pytest-mock", "responses", "httpx", "requests-mock"]

# Define a set of optional packages for use when deploying persistent data services
pds = ["flask-tools[autogen,rdkit,chemprice]"]

all = ["flask-tools[rdkit,flask,chemprop,chemprice,similarity_search,molecular_minds]"]

#[tool.pytest]
[tool.pytest.ini_options]
markers = [
    "llm_query: a test that requires LLM API calls",
]
# Do not run the llm ones by default
addopts = '-m "not llm_query"'
